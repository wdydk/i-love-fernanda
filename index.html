
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I Love Fernanda 💙</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #02040d;
    color: white;
    font-family: Arial, sans-serif;
    overflow: hidden;
}

canvas {
    display: block;
    width: 100vw;
    height: 100dvh;
    touch-action: manipulation;
}

#musicButton {
    position: fixed;
    top: 18px;
    right: 18px;
    z-index: 10;
    padding: 12px 18px;
    border: 1px solid #4477a8;
    border-radius: 30px;
    background: #08152bd9;
    color: #aaddff;
    cursor: pointer;
}

.overlay {
    position: fixed;
    inset: 0;
    display: grid;
    place-items: center;
    pointer-events: none;
}

#passwordBox {
    display: none;
    width: min(86vw, 330px);
    padding: 25px;
    border: 1px solid #70caff80;
    border-radius: 25px;
    background: #061327e8;
    box-shadow: 0 0 50px #1688ff40;
    backdrop-filter: blur(15px);
    text-align: center;
    pointer-events: auto;
    animation: appear 1.4s ease both;
}

.lock {
    font-size: 35px;
    margin-bottom: 15px;
    filter: drop-shadow(0 0 12px #00aaff);
}

#passwordBox h2 {
    font-size: 23px;
    color: #c2ebff;
    margin-bottom: 15px;
}

#passwordBox p {
    font-size: 14px;
    color: #b4cce8;
    line-height: 1.6;
    margin-bottom: 18px;
}

input {
    width: 100%;
    padding: 15px;
    border: 1px solid #345779;
    border-radius: 12px;
    background: #040c1d;
    color: white;
    text-align: center;
    outline: none;
    font-size: 16px;
}

input:focus {
    border-color: #77caff;
    box-shadow: 0 0 15px #008cff40;
}

#unlock {
    width: 100%;
    padding: 14px;
    margin-top: 12px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(135deg, #245edb, #58bbff);
    color: white;
    font-weight: bold;
    cursor: pointer;
    transition: .3s;
}

#unlock:hover {
    transform: translateY(-2px);
    box-shadow: 0 0 25px #3498ff80;
}

#error {
    margin-top: 12px;
    min-height: 16px;
    color: #ff99af;
    font-size: 13px;
}

#finalTitle {
    position: fixed;
    top: 13%;
    width: 100%;
    text-align: center;
    opacity: 0;
    transform: translateY(-20px);
    transition: 2s;
    pointer-events: none;
}

#finalTitle h1 {
    font-size: clamp(24px, 5vw, 54px);
    letter-spacing: 3px;
    text-shadow: 0 0 25px #279cff;
}

#finalTitle p {
    margin-top: 12px;
    color: #91d7ff;
    letter-spacing: 2px;
    font-size: 14px;
}

#finalMessage {
    position: fixed;
    bottom: 5%;
    left: 5%;
    width: 90%;
    text-align: center;
    opacity: 0;
    transform: translateY(20px);
    transition: 2s;
    pointer-events: none;
}

#finalMessage h2 {
    font-family: Georgia, serif;
    font-size: clamp(19px, 3.5vw, 38px);
    font-weight: normal;
    color: #d9f1ff;
    text-shadow: 0 0 18px #2196ff;
}

#finalMessage p {
    margin-top: 12px;
    font-size: 14px;
    color: #91b5df;
}

.visible {
    opacity: 1 !important;
    transform: translateY(0) !important;
}

@keyframes appear {
    from {
        opacity: 0;
        transform: scale(.85);
    }
    to {
        opacity: 1;
        transform: scale(1);
    }
}
</style>
</head>

<body>

<canvas id="canvas"></canvas>

<button id="musicButton">♫ Activar música</button>

<div class="overlay">
    <form id="passwordBox">
        <div class="lock">💙</div>

        <h2>Solo tú sabes la respuesta</h2>

        <p>¿Cuál es el corazón que usamos para nosotros?</p>

        <input
            id="answer"
            type="password"
            placeholder="Nuestra contraseña..."
            autocomplete="off"
        >

        <button id="unlock" type="submit">
            Desbloquear mi corazón ♡
        </button>

        <div id="error"></div>
    </form>
</div>

<div id="finalTitle">
    <h1>I LOVE FERNANDA</h1>
    <p>NUESTRO PEQUEÑO UNIVERSO 💙</p>
</div>

<div id="finalMessage">
    <h2>Fernanda, eres mi persona favorita 💙</h2>
    <p>Entre millones de personas, siempre te elegiría a ti.</p>
</div>

<audio id="song" src="musica.mp3" loop preload="none"></audio>

<script>

// ==========================================
// CONFIGURACIÓN
// ==========================================

const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

const passwordBox = document.getElementById("passwordBox");
const answer = document.getElementById("answer");
const error = document.getElementById("error");

const photo = new Image();
photo.src = "foto.png";

const SECRET = "azul";
const NAME = "FERNANDA";
const BLUE = "#65caff";

let W, H, DPR;
let phase = "heart";
let particles = [];
let stars = [];

let start = performance.now();
let previous = start;
let unlockedAt = 0;
let lastFirework = 0;
let lastHeart = 0;

// ==========================================
// PANTALLA Y ESTRELLAS
// ==========================================

function resize() {
    W = window.innerWidth;
    H = canvas.clientHeight;
    DPR = Math.min(window.devicePixelRatio || 1, 2);

    canvas.width = W * DPR;
    canvas.height = H * DPR;

    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    stars = Array.from({ length: 150 }, () => ({
        x: Math.random() * W,
        y: Math.random() * H,
        size: .3 + Math.random() * 1.5,
        offset: Math.random() * Math.PI * 2,
        speed: .5 + Math.random()
    }));
}

window.addEventListener("resize", resize);
resize();

function background(time) {
    const gradient = ctx.createRadialGradient(
        W / 2, H * .45, 0,
        W / 2, H * .45, Math.max(W, H) * .7
    );

    gradient.addColorStop(0, "#10244d");
    gradient.addColorStop(.45, "#060d23");
    gradient.addColorStop(1, "#010208");

    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, W, H);

    for (const s of stars) {
        ctx.globalAlpha =
            .2 + (Math.sin(time * s.speed + s.offset) + 1) * .35;

        ctx.fillStyle = "#b9dfff";
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.globalAlpha = 1;
}

// ==========================================
// CORAZÓN GIGANTE
// ==========================================

function heart(t) {
    return {
        x: 16 * Math.pow(Math.sin(t), 3),
        y: -(13 * Math.cos(t)
            - 5 * Math.cos(2 * t)
            - 2 * Math.cos(3 * t)
            - Math.cos(4 * t))
    };
}

function drawMainHeart(time) {
    const progress = Math.min(time / 6, 1);
    const size = Math.min(W / 38, H / 38);
    const beat = 1 + Math.sin(time * 3) * .025;

    const cx = W / 2;
    const cy = H / 2 - size;

    ctx.save();
    ctx.textAlign = "center";
    ctx.textBaseline = "middle";
    ctx.shadowColor = BLUE;
    ctx.shadowBlur = 10;
    ctx.fillStyle = BLUE;

    const total = 155;

    for (let i = 0; i < total * progress; i++) {
        const t = i / total * Math.PI * 2;
        const p = heart(t);

        for (let layer = 0; layer < 4; layer++) {
            const s = size * beat * (1 - layer * .045);

            ctx.globalAlpha = 1 - layer * .18;
            ctx.font = `bold ${Math.max(5, size * .39)}px monospace`;

            ctx.fillText(
                "love you",
                cx + p.x * s,
                cy + p.y * s
            );
        }
    }

    ctx.globalAlpha = 1;

    if (time >= 6 && phase === "heart") {
        ctx.shadowBlur = 25;
        ctx.fillStyle = "#ffffff";

        ctx.font = `bold ${size * 1.3}px Arial`;

        ctx.fillText("I LOVE " + NAME, cx, cy);

        ctx.font = `${size}px Arial`;
        ctx.fillText("💙", cx, cy + size * 2);
    }

    ctx.restore();

    // Mostrar la contraseña después del corazón
    if (time > 9 && phase === "heart") {
        phase = "password";
        passwordBox.style.display = "block";
    }
}

// ==========================================
// CORAZONES Y FUEGOS ARTIFICIALES
// ==========================================

function burst(x, y, amount = 65) {
    const colors = [
        "#38aaff",
        "#77ddff",
        "#e0f7ff",
        "#487bff"
    ];

    for (let i = 0; i < amount; i++) {
        const a = Math.random() * Math.PI * 2;
        const speed = 30 + Math.random() * 190;
        const life = 1.4 + Math.random() * 1.7;

        particles.push({
            x, y,
            vx: Math.cos(a) * speed,
            vy: Math.sin(a) * speed,
            life,
            maxLife: life,
            size: 1.5 + Math.random() * 4,
            color: colors[Math.floor(Math.random() * colors.length)],
            heart: Math.random() < .28
        });
    }
}

function drawSmallHeart(x, y, s) {
    ctx.beginPath();
    ctx.moveTo(x, y + s);

    ctx.bezierCurveTo(
        x - s * 2, y - s * .4,
        x - s * .8, y - s * 2,
        x, y - s * .8
    );

    ctx.bezierCurveTo(
        x + s * .8, y - s * 2,
        x + s * 2, y - s * .4,
        x, y + s
    );

    ctx.fill();
}

function updateParticles(dt) {
    ctx.save();

    for (const p of particles) {
        const oldX = p.x;
        const oldY = p.y;

        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 35 * dt;

        p.vx *= Math.pow(.92, dt * 5);
        p.life -= dt;

        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.strokeStyle = p.color;
        ctx.shadowColor = p.color;
        ctx.shadowBlur = 12;

        if (p.heart) {
            drawSmallHeart(p.x, p.y, p.size * 1.5);
        } else {
            ctx.lineWidth = 1.5;
            ctx.beginPath();
            ctx.moveTo(oldX - p.vx * .04, oldY - p.vy * .04);
            ctx.lineTo(p.x, p.y);
            ctx.stroke();

            ctx.beginPath();
            ctx.arc(p.x, p.y, p.size * .55, 0, Math.PI * 2);
            ctx.fill();
        }
    }

    particles = particles.filter(p => p.life > 0);

    // Evitar demasiadas partículas
    if (particles.length > 1800) {
        particles = particles.slice(-1800);
    }

    ctx.restore();
}

// ==========================================
// DIBUJAR FOTO
// ==========================================

function drawPhoto(x, y, w, h) {
    ctx.save();

    ctx.shadowColor = "#369eff";
    ctx.shadowBlur = 30;
    ctx.fillStyle = "#c6eaff";

    ctx.fillRect(x - 5, y - 5, w + 10, h + 10);

    ctx.shadowBlur = 0;

    if (photo.complete && photo.naturalWidth > 0) {
        ctx.drawImage(photo, x, y, w, h);
    } else {
        ctx.fillStyle = "#10284d";
        ctx.fillRect(x, y, w, h);

        ctx.fillStyle = "white";
        ctx.textAlign = "center";
        ctx.font = "14px Arial";
        ctx.fillText("Nuestra foto 💙", x + w / 2, y + h / 2);
    }

    ctx.restore();
}

// ==========================================
// STICKMAN CON BRAZOS Y PIERNAS ANIMADOS
// ==========================================

function line(points) {
    ctx.beginPath();
    ctx.moveTo(points[0][0], points[0][1]);

    for (let i = 1; i < points.length; i++) {
        ctx.lineTo(points[i][0], points[i][1]);
    }

    ctx.stroke();
}

function drawStickman(edge, photoY, photoH, ground, u, time, walking) {

    const step = walking ? Math.sin(time * 10) : 0;
    const bob = walking ? Math.abs(step) * 4 * u : 0;

    // Articulaciones principales
    const hipX = edge + 48 * u;
    const hipY = ground - 48 * u - bob;

    const shoulderX = hipX + 13 * u;
    const shoulderY = hipY - 37 * u;

    const headX = shoulderX + 5 * u;
    const headY = shoulderY - 16 * u;

    // Ambas manos siempre sujetan la foto
    const hand1 = [
        edge + 5,
        photoY + photoH * .42
    ];

    const hand2 = [
        edge + 5,
        photoY + photoH * .52
    ];

    ctx.save();

    ctx.strokeStyle = "#d3efff";
    ctx.fillStyle = "#d3efff";
    ctx.lineWidth = 3.7 * u;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.shadowColor = "#269fff";
    ctx.shadowBlur = 13;

    // Brazo trasero
    line([
        [shoulderX, shoulderY + 3 * u],
        [edge + 24 * u, shoulderY + 15 * u],
        hand2
    ]);

    // Pierna izquierda
    line([
        [hipX, hipY],
        [hipX + step * 13 * u, hipY + 24 * u],
        [
            hipX + step * 26 * u,
            ground - Math.max(0, -step) * 10 * u
        ]
    ]);

    // Pierna derecha
    line([
        [hipX, hipY],
        [hipX - step * 13 * u, hipY + 24 * u],
        [
            hipX - step * 26 * u,
            ground - Math.max(0, step) * 10 * u
        ]
    ]);

    // Cuerpo inclinado hacia delante
    line([
        [hipX, hipY],
        [shoulderX, shoulderY]
    ]);

    // Cabeza
    ctx.beginPath();
    ctx.arc(headX, headY, 13 * u, 0, Math.PI * 2);
    ctx.stroke();

    // Brazo delantero
    line([
        [shoulderX, shoulderY],
        [edge + 27 * u, shoulderY + 7 * u],
        hand1
    ]);

    // Manos sujetando el marco
    for (const hand of [hand1, hand2]) {
        ctx.beginPath();
        ctx.arc(hand[0], hand[1], 3.2 * u, 0, Math.PI * 2);
        ctx.fill();
    }

    ctx.restore();
}

// ==========================================
// ESCENA FINAL
// ==========================================

function successScene(time, now) {

    const elapsed = (now - unlockedAt) / 1000;

    // Duración del movimiento
    const progress = Math.min(elapsed / 5.5, 1);

    // Frenado progresivo al llegar
    const eased = 1 - Math.pow(1 - progress, 2);

    const u = Math.min(W / 380, H / 450, 2);
    const ground = H * .77;

    const ratio = photo.naturalWidth && photo.naturalHeight
        ? photo.naturalWidth / photo.naturalHeight
        : .72;

    const ph = Math.min(
        H * .38,
        W * .45 / ratio,
        370
    );

    const pw = ph * ratio;

    const groupWidth = pw + 100 * u;
    const destination = (W - groupWidth) / 2;

    const initialX = -pw - 130 * u;

    const x = initialX + (destination - initialX) * eased;

    const walking = progress < 1;

    const bob = walking
        ? Math.sin(elapsed * 10) * 1.7
        : 0;

    const y = ground - ph + bob;

    // Luz suave en el suelo
    ctx.save();
    ctx.shadowColor = BLUE;
    ctx.shadowBlur = 15;
    ctx.fillStyle = "#408cff30";
    ctx.fillRect(W * .08, ground + 5, W * .84, 2);
    ctx.restore();

    // Foto arrastrándose
    drawPhoto(x, y, pw, ph);

    // Personaje agarrando la foto
    drawStickman(
        x + pw,
        y,
        ph,
        ground,
        u,
        elapsed,
        walking
    );

    // Pequeños corazones durante el recorrido
    if (now - lastHeart > 240) {
        burst(x + pw / 2, y + 10, 5);
        lastHeart = now;
    }

    // Fuegos artificiales continuos
    if (now - lastFirework > 750) {
        burst(
            W * (.12 + Math.random() * .76),
            H * (.14 + Math.random() * .25),
            55
        );

        lastFirework = now;
    }

    // Dedicatoria al terminar de caminar
    if (progress === 1) {
        document.getElementById("finalMessage")
            .classList.add("visible");
    }
}

// ==========================================
// CONTRASEÑA SECRETA
// ==========================================

passwordBox.addEventListener("submit", e => {
    e.preventDefault();

    const value = answer.value.toLowerCase().trim();

    if (value !== SECRET) {
        error.textContent = "Inténtalo otra vez, mi amor ♡";
        return;
    }

    passwordBox.style.display = "none";

    phase = "success";
    unlockedAt = performance.now();

    document.getElementById("finalTitle")
        .classList.add("visible");

    burst(W / 2, H / 2, 130);

    if (!musicOn) toggleMusic();
});

// ==========================================
// MÚSICA ROMÁNTICA
// ==========================================

const song = document.getElementById("song");
const musicButton = document.getElementById("musicButton");

let audioContext;
let musicTimer;
let musicOn = false;
let musicVersion = 0;

// Melodía instrumental original
const melody = [
    60, 64, 67, 72,
    59, 62, 67, 71,
    57, 60, 64, 69,
    53, 57, 60, 65
];

let noteIndex = 0;

function playNote() {
    if (!musicOn || !audioContext) return;

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    const midi = melody[noteIndex % melody.length];
    noteIndex++;

    const frequency = 440 * Math.pow(2, (midi - 69) / 12);
    const t = audioContext.currentTime;

    oscillator.type = "sine";
    oscillator.frequency.value = frequency;

    gain.gain.setValueAtTime(.001, t);
    gain.gain.linearRampToValueAtTime(.065, t + .09);
    gain.gain.exponentialRampToValueAtTime(.001, t + 1.6);

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    oscillator.start(t);
    oscillator.stop(t + 1.7);
}

async function toggleMusic() {

    musicOn = !musicOn;
    const version = ++musicVersion;

    if (!musicOn) {
        song.pause();
        clearInterval(musicTimer);

        musicButton.textContent = "♫ Activar música";
        return;
    }

    musicButton.textContent = "♫ Pausar música";

    // Preparar audio desde la interacción del usuario
    try {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;

        if (AudioCtx) {
            audioContext = audioContext || new AudioCtx();
            await audioContext.resume();
        }
    } catch (e) {}

    if (!musicOn || version !== musicVersion) return;

    // Primero intenta reproducir musica.mp3
    try {
        song.volume = .45;
        await song.play();

        if (!musicOn || version !== musicVersion) {
            song.pause();
        }

    } catch (e) {

        // Si no existe el MP3, usa la melodía original
        if (!musicOn || version !== musicVersion) return;

        if (audioContext) {
            playNote();
            musicTimer = setInterval(playNote, 480);
        } else {
            musicOn = false;
            musicButton.textContent = "♫ Activar música";
        }
    }
}

musicButton.addEventListener("click", toggleMusic);

// ==========================================
// ANIMACIÓN PRINCIPAL
// ==========================================

function animate(now) {

    const dt = Math.min((now - previous) / 1000, .05);
    previous = now;

    const time = (now - start) / 1000;

    background(time);

    if (phase === "heart" || phase === "password") {
        drawMainHeart(time);
    }

    if (phase === "success") {
        successScene(time, now);
    }

    updateParticles(dt);

    requestAnimationFrame(animate);
}

// Tocar la pantalla genera fuegos artificiales
canvas.addEventListener("pointerdown", e => {
    burst(e.clientX, e.clientY, 40);
});

requestAnimationFrame(animate);

</script>
</body>
</html>
